<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Social links profile</title>
  <body>
    <div class="container">
    <img src="./assets/images/avatar-jessica.jpeg" alt="avatar of profile" class="img-container">
    <p id="greeting" class="greeting-text"></p>
    <h1 class="h1-container name">Jessica Randall</h1>
    <p class="p1-container">London, United Kingdom</p>
    <p class="p2-container">"Front-end developer and avid
    reader."</p>
    <nav aria-label="Social links">
    <ul class="social-links">
      <li role="listitem">
        <a aria-label="github" href="https://github.com" target="_blank" class="social-button">GitHub</a>
      </li>
    </ul>
    </nav>
    <nav aria-label="Social links">
    <ul class="social-links">
      <li role="listitem">
        <a aria-label="Frontendmentor" href="https://Frontendmentor.io" target="_blank" class="social-button">Frontend Mentor</a>
      </li>
    </ul>
    </nav>
    <nav aria-label="Social links">
    <ul class="social-links">
      <li role="listitem">
        <a aria-label="LinkedIn" href="https://LinkedIn.com" target="_blank" class="social-button">LinkedIn</a>
      </li>
    </ul>
    </nav>
    <nav aria-label="Social links">
    <ul class="social-links">
      <li role="listitem">
        <a aria-label="Twitter" href="https://Twitter.com" target="_blank" class="social-button">Twitter</a>
      </li>
    </ul>
    </nav>
    <nav aria-label="Social links">
    <ul class="social-links">
      <li role="listitem">
        <a aria-label="Instagram" href="https://Instagram.com" target="_blank" class="social-button">Instagram</a>
      </li>
    </ul>
    </nav>
    </div>
    <script src="script.js"></script>
  </body>
</html>
